# T-Pot: THESIS RESEARCH EDITION
#
# Based on the repository's 24.04.1 service catalog. This file intentionally
# exposes only the requested honeypot protocols while retaining the local
# Elastic/Kibana pipeline, T-Pot initialization, NGINX management, and NSM.
# Captured samples remain artifacts under ${TPOT_DATA_PATH}; this compose adds
# no post-capture execution or third-party sample upload. Tanner's required
# PHPox dependency retains its built-in isolated PHP-emulation behavior.

networks:
  cowrie_local:
  ddospot_local:
  dionaea_local:
  mailoney_local:
  rdphoneypot_local:
  sentrypeer_local:
  tanner_local:
  nginx_local:

services:

#########################################
#### T-Pot Init - Never delete this!
#########################################

  tpotinit:
    container_name: tpotinit
    env_file:
      - .env
    restart: always
    stop_grace_period: 60s
    tmpfs:
      - /tmp/etc:uid=2000,gid=2000
      - /tmp/:uid=2000,gid=2000
    network_mode: "host"
    cap_add:
      - NET_ADMIN
    image: ${TPOT_REPO}/tpotinit:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
      # Do not use TPOT_DOCKER_COMPOSE here: .env points it at the unchanged
      # Standard edition. T-Pot init must inspect this thesis configuration.
      - ./docker-compose.thesis.yml:/tmp/tpot/docker-compose.yml:ro
      - ${TPOT_DATA_PATH}/blackhole:/etc/blackhole
      - ${TPOT_DATA_PATH}:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro

##################
#### Honeypots
##################

# SSH and Telnet; downloads and session logs are persisted below.
  cowrie:
    container_name: cowrie
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    tmpfs:
      - /tmp/cowrie:uid=2000,gid=2000
      - /tmp/cowrie/data:uid=2000,gid=2000
    networks:
      - cowrie_local
    ports:
      - "22:22"
      - "23:23"
    image: ${TPOT_REPO}/cowrie:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/cowrie/downloads:/home/cowrie/cowrie/dl
      - ${TPOT_DATA_PATH}/cowrie/keys:/home/cowrie/cowrie/etc
      - ${TPOT_DATA_PATH}/cowrie/log:/home/cowrie/cowrie/log
      - ${TPOT_DATA_PATH}/cowrie/log/tty:/home/cowrie/cowrie/log/tty

# DNS and NTP. The repository-supported implementation provides UDP only.
  ddospot:
    container_name: ddospot
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
      - ddospot_local
    ports:
      - "53:53/udp"
      - "123:123/udp"
    image: ${TPOT_REPO}/ddospot:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/ddospot/log:/opt/ddospot/ddospot/logs
      - ${TPOT_DATA_PATH}/ddospot/bl:/opt/ddospot/ddospot/bl
      - ${TPOT_DATA_PATH}/ddospot/db:/opt/ddospot/ddospot/db

# FTP, SMB, and MySQL. Dionaea's captured binaries and protocol roots remain
# persistent even though its unrelated public listeners are not published.
  dionaea:
    container_name: dionaea
    stdin_open: true
    tty: true
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
      - dionaea_local
    ports:
      - "21:21"
      - "445:445"
      - "3306:3306"
    image: ${TPOT_REPO}/dionaea:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/dionaea/roots/ftp:/opt/dionaea/var/dionaea/roots/ftp
      - ${TPOT_DATA_PATH}/dionaea/roots/tftp:/opt/dionaea/var/dionaea/roots/tftp
      - ${TPOT_DATA_PATH}/dionaea/roots/www:/opt/dionaea/var/dionaea/roots/www
      - ${TPOT_DATA_PATH}/dionaea/roots/upnp:/opt/dionaea/var/dionaea/roots/upnp
      - ${TPOT_DATA_PATH}/dionaea:/opt/dionaea/var/dionaea
      - ${TPOT_DATA_PATH}/dionaea/binaries:/opt/dionaea/var/dionaea/binaries
      - ${TPOT_DATA_PATH}/dionaea/log:/opt/dionaea/var/log
      - ${TPOT_DATA_PATH}/dionaea/rtp:/opt/dionaea/var/dionaea/rtp

# SMTP on the standard service port only (submission port 587 is omitted).
  mailoney:
    container_name: mailoney
    stdin_open: true
    tty: true
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
      - mailoney_local
    ports:
      - "25:25"
    image: ${TPOT_REPO}/mailoney:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/mailoney/log:/opt/mailoney/logs

  rdphoneypot:
    container_name: rdphoneypot
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
      - rdphoneypot_local
    ports:
      - "3389:3389"
    image: ${TPOT_REPO}/rdphoneypot:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/rdphoneypot/cert:/opt/rdphoneypot/cert
      - ${TPOT_DATA_PATH}/rdphoneypot/log:/opt/rdphoneypot/log

# SIP is supported on both transports by this repository's SentryPeer image.
  sentrypeer:
    container_name: sentrypeer
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
      - sentrypeer_local
    ports:
      - "5060:5060/tcp"
      - "5060:5060/udp"
    image: ${TPOT_REPO}/sentrypeer:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/sentrypeer/log:/var/log/sentrypeer

#### Snare / Tanner HTTP stack

  tanner_redis:
    container_name: tanner_redis
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    tty: true
    networks:
      - tanner_local
    image: ${TPOT_REPO}/redis:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true

  tanner_phpox:
    container_name: tanner_phpox
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    tmpfs:
      - /tmp:uid=2000,gid=2000,mode=1777
    tty: true
    networks:
      - tanner_local
    image: ${TPOT_REPO}/phpox:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true

  tanner_api:
    container_name: tanner_api
    restart: always
    depends_on:
      - tanner_redis
    tmpfs:
      - /tmp/tanner:uid=2000,gid=2000
    tty: true
    networks:
      - tanner_local
    image: ${TPOT_REPO}/tanner:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/tanner/log:/var/log/tanner
    command: tannerapi

  tanner:
    container_name: tanner
    restart: always
    depends_on:
      - tanner_api
      - tanner_phpox
    tmpfs:
      - /tmp/tanner:uid=2000,gid=2000
    tty: true
    networks:
      - tanner_local
    image: ${TPOT_REPO}/tanner:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    command: tanner
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/tanner/log:/var/log/tanner
      - ${TPOT_DATA_PATH}/tanner/files:/opt/tanner/files

  snare:
    container_name: snare
    restart: always
    depends_on:
      - tanner
    tty: true
    networks:
      - tanner_local
    ports:
      - "80:80"
    image: ${TPOT_REPO}/snare:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}

##################
#### NSM
##################

# These services preserve packet-derived metadata and detections that add
# research context around the selected honeypot events.
  fatt:
    container_name: fatt
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_RAW
    image: ${TPOT_REPO}/fatt:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
      - ${TPOT_DATA_PATH}/fatt/log:/opt/fatt/log

  p0f:
    container_name: p0f
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    network_mode: "host"
    image: ${TPOT_REPO}/p0f:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/p0f/log:/var/log/p0f

  suricata:
    container_name: suricata
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    environment:
      - OINKCODE=${OINKCODE:-OPEN}
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - NET_RAW
    image: ${TPOT_REPO}/suricata:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
      - ${TPOT_DATA_PATH}/suricata/log:/var/log/suricata

##################
#### Local Elastic stack and management
##################

  elasticsearch:
    container_name: elasticsearch
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
      - nginx_local
    environment:
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms2048m -Xmx2048m
      - ES_TMPDIR=/tmp
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    mem_limit: 4g
    ports:
      - "127.0.0.1:64298:9200"
    image: ${TPOT_REPO}/elasticsearch:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
      - ${TPOT_DATA_PATH}:/data

  kibana:
    container_name: kibana
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nginx_local
    mem_limit: 1g
    ports:
      - "127.0.0.1:64296:5601"
    image: ${TPOT_REPO}/kibana:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}

  logstash:
    container_name: logstash
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nginx_local
    environment:
      - LS_JAVA_OPTS=-Xms1024m -Xmx1024m
      - TPOT_TYPE=${TPOT_TYPE:-HIVE}
      - TPOT_HIVE_USER=${TPOT_HIVE_USER}
      - TPOT_HIVE_IP=${TPOT_HIVE_IP}
      - LS_SSL_VERIFICATION=${LS_SSL_VERIFICATION:-full}
    ports:
      - "127.0.0.1:64305:64305"
    mem_limit: 2g
    image: ${TPOT_REPO}/logstash:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    volumes:
      - ${TPOT_DATA_PATH}:/data

# T-Pot Attack Map, copied unchanged from the upstream docker-compose.yml
# (24.04.1 services map_redis / map_web / map_data). DataServer_v2.py polls
# the logstash-* indices in Elasticsearch, which already include the thesis
# honeypots (Cowrie, Ddospot, Dionaea, Mailoney, RDPHoneypot, Sentrypeer,
# Tanner), publishes to Redis, and AttackMapServer.py serves the page and the
# /websocket feed behind NGINX (/map/ and /websocket, basic auth).
## Map Redis Service
  map_redis:
    container_name: map_redis
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
      - nginx_local
    stop_signal: SIGKILL
    tty: true
    image: ${TPOT_REPO}/redis:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true

## Map Web Service
  map_web:
    container_name: map_web
    restart: always
    depends_on:
      tpotinit:
        condition: service_healthy
    networks:
      - nginx_local
    environment:
      - MAP_COMMAND=AttackMapServer.py
    stop_signal: SIGKILL
    tty: true
    ports:
      - "127.0.0.1:64299:64299"
    image: ${TPOT_REPO}/map:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}

## Map Data Service
  map_data:
    container_name: map_data
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - nginx_local
    environment:
      - MAP_COMMAND=DataServer_v2.py
      - TPOT_ATTACKMAP_TEXT=${TPOT_ATTACKMAP_TEXT}
      - TZ=${TPOT_ATTACKMAP_TEXT_TIMEZONE}
    stop_signal: SIGKILL
    tty: true
    image: ${TPOT_REPO}/map:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}

# NGINX serves the landing page, Kibana (/kibana/), the Attack Map (/map/,
# /websocket) and Elasticvue (/elasticvue/ + the /es/ proxy), all behind basic
# auth. The thesis landing page is mounted over the image's index.html; the
# upstream docker/nginx/dist sources are untouched. The unchanged upstream
# tpotweb.conf still routes /cyberchef and /spiderfoot, but neither is linked.
  nginx:
    container_name: nginx
    restart: always
    environment:
      - TPOT_OSTYPE=${TPOT_OSTYPE}
    depends_on:
      tpotinit:
        condition: service_healthy
    tmpfs:
      - /var/tmp/nginx/client_body
      - /var/tmp/nginx/proxy
      - /var/tmp/nginx/fastcgi
      - /var/tmp/nginx/uwsgi
      - /var/tmp/nginx/scgi
      - /run
      - /var/lib/nginx/tmp:uid=100,gid=82
    networks:
      - nginx_local
    ports:
      - "64297:64297"
    image: ${TPOT_REPO}/nginx:${TPOT_VERSION}
    pull_policy: ${TPOT_PULL_POLICY}
    read_only: true
    volumes:
      - ${TPOT_DATA_PATH}/nginx/cert/:/etc/nginx/cert/:ro
      - ${TPOT_DATA_PATH}/nginx/conf/nginxpasswd:/etc/nginx/nginxpasswd:ro
      - ${TPOT_DATA_PATH}/nginx/conf/lswebpasswd:/etc/nginx/lswebpasswd:ro
      - ${TPOT_DATA_PATH}/nginx/log/:/var/log/nginx/
      - ./thesis/nginx/index.html:/var/lib/nginx/html/index.html:ro
